    <script>
// === db.js INLINED ===
console.log("db.js loaded");
try { localStorage.setItem('pcr_region', 'tw'); } catch (_) { /* Storage is optional. */ }
/**
 * PCR 數據導航站 - DB 引擎
 * 負責下載、快取與查詢 SQLite 資料庫
 */

window.PCRDatabase = {
    db: null,
    currentRegion: 'tw',
    cacheWarning: '',

    async matchesRelease(buffer, size, version) {
        if (Object.prototype.toString.call(buffer) !== '[object ArrayBuffer]' || (size > 0 && buffer.byteLength !== size)) return false;
        // Published versions contain the first 12 SHA-256 characters.
        const match = /^hash_([a-f0-9]{12})$/.exec(version || '');
        if (match) {
            if (!globalThis.crypto || !globalThis.crypto.subtle) {
                throw new Error('無法驗證資料庫版本，請使用 HTTPS 或 localhost 開啟網站。');
            }
            const digest = await globalThis.crypto.subtle.digest('SHA-256', buffer);
            const hash = Array.from(new Uint8Array(digest), n => n.toString(16).padStart(2, '0')).join('');
            return hash.startsWith(match[1]);
        }
        return true;
    },

    openVerifiedDatabase(SQL, buffer) {
        try {
            this.db = new SQL.Database(new Uint8Array(buffer));
            if (this.verifyDatabase()) return true;
        } catch (error) {
            console.warn('[PCRDatabase] 無法開啟資料庫:', error);
        }
        if (this.db && typeof this.db.close === 'function') this.db.close();
        this.db = null;
        return false;
    },

    /**
     * 切換區域 (目前僅支援台服，強制定向為 tw)
     */
    async switchRegion(region) {
        localStorage.setItem('pcr_region', 'tw');
        location.reload();
    },

    /**
     * 驗證資料庫結構完整性
     */
    verifyDatabase() {
        if (!this.db) return false;
        try {
            // 測試查詢 story_detail 表是否存在且有資料
            const res = this.runQuery("SELECT COUNT(*) as cnt FROM sqlite_master WHERE type='table' AND name='story_detail'");
            if (res && res.length > 0 && res[0].cnt > 0) {
                // 進一步檢查是否包含主線劇情資料
                const rows = this.runQuery("SELECT COUNT(*) as cnt FROM story_detail");
                return rows && rows.length > 0 && rows[0].cnt > 0;
            }
            return false;
        } catch (e) {
            console.error("[PCRDatabase] 驗證資料庫結構出錯:", e);
            return false;
        }
    },

    /**
     * 初始化資料庫
     * @param {Function} onProgress 進度回調 (message, percent)
     */
    async initDatabase(onProgress) {
        if (this.db) return this.db;

        const dbKey = `pcr_db_${this.currentRegion}`;
        const localPath = `./redive_${this.currentRegion}.db`;
        this.cacheWarning = '';

        try {
            // 1. 初始化 SQL 引擎 (WebAssembly)
            if (onProgress) onProgress('正在初始化 SQL 引擎...', 10);
            
            if (typeof initSqlJs === 'undefined') {
                throw new Error("無法載入 SQL 引擎元件 (initSqlJs 未定義)。請嘗試按 Ctrl+F5 強制重新整理頁面。");
            }

            const sqlPromise = initSqlJs({
                locateFile: file => `${file}`
            });

            let timer;
            const timeoutPromise = new Promise((_, reject) => {
                timer = setTimeout(() => reject(new Error('初始化 SQL 引擎逾時，請重新載入。')), 10000);
            });
            const SQL = await Promise.race([sqlPromise, timeoutPromise]).finally(() => clearTimeout(timer));

            // 從 data/db_info.json 一次性取得 size 與 db_version（合併為單一請求）
            let size = 0;
            let latestVersion = "";
            try {
                const infoRes = await fetch(`data/db_info.json?v=${Date.now()}`, { signal: AbortSignal.timeout(10000) });
                if (infoRes.ok) {
                    const info = await infoRes.json();
                    size = parseInt(info[`${this.currentRegion}_size`], 10) || 0;
                    latestVersion = info.db_version || "";
                    console.log(`[PCRDatabase] db_info: size=${size}, version=${latestVersion}`);
                }
            } catch (e) {
                console.warn("[PCRDatabase] 讀取 db_info.json 失敗，改用 HEAD 備用機制:", e);
            }

            // 若 db_info 無法取得 size，降級使用 HEAD 請求
            if (size <= 0) {
                try {
                    const headRes = await fetch(localPath, { method: 'HEAD', signal: AbortSignal.timeout(10000) });
                    if (headRes.ok) {
                        const cl = headRes.headers.get('content-length');
                        if (cl) size = parseInt(cl, 10);
                    }
                } catch (e) {
                    console.warn(`[PCRDatabase] HEAD ${localPath} failed...`, e);
                }
            }

            // Version and bytes live in one IDB record. Never erase the previous
            // release until the replacement has downloaded and passed validation.
            const cached = await this.loadFromIDB(dbKey);
            const record = cached && cached.format === 2 ? cached : null;
            const legacyHashCache = !record && /^hash_[a-f0-9]{12}$/.test(latestVersion);
            const cacheBytes = record ? record.buffer : cached;
            const sameVersion = record && latestVersion && record.version === latestVersion;
            if ((sameVersion || legacyHashCache) &&
                await this.matchesRelease(cacheBytes, size, latestVersion) &&
                this.openVerifiedDatabase(SQL, cacheBytes)) {
                this.dbVersion = latestVersion;
                if (onProgress) onProgress('已載入快取資料庫', 100);
                return this.db;
            }

            // Only use the database shipped with this site. A third-party mirror
            // may be a different release, even when its schema and size match.
            if (onProgress) onProgress('正在下載網站資料庫...', 20);
            const dbData = await this.downloadDB(`${localPath}?v=${encodeURIComponent(latestVersion || 'current')}`, pct => {
                if (onProgress) onProgress(`正在下載資料庫... ${pct}%`, 20 + pct * 0.7);
            });
            if (!await this.matchesRelease(dbData, size, latestVersion)) {
                throw new Error('資料庫與網站版本不一致，可能正在更新，請稍後重新載入。');
            }
            if (!this.openVerifiedDatabase(SQL, dbData)) {
                throw new Error('載入的資料庫格式有誤，找不到劇情資料表。');
            }
            this.dbVersion = latestVersion;
            try {
                await this.saveToIDB(dbKey, { format: 2, version: latestVersion, buffer: dbData });
            } catch (error) {
                this.cacheWarning = '無法保存資料庫快取，本次仍可閱讀；下次開啟會重新下載。';
                console.warn('[PCRDatabase]', this.cacheWarning, error);
            }
            if (onProgress) onProgress('資料庫已就緒', 100);
            return this.db;
        } catch (error) {
            console.error('Database Init Error:', error);
            if (onProgress) onProgress(`載入失敗: ${error.message}`, 0);
            throw error;
        }
    },


    /**
     * 載入特定的資料庫（專供比對使用，不覆蓋主 db）
     */
    async loadSpecificDatabase(type, onProgress) {
        const dbKey = `pcr_db_${type}`;
        const localPath = `./redive_${type}.db`;
        const sizeKey = `pcr_db_size_${type}`;

        try {
            if (onProgress) onProgress('正在初始化 SQL 引擎...', 10);
            
            if (typeof initSqlJs === 'undefined') {
                throw new Error("無法載入 SQL 引擎元件 (initSqlJs 未定義)。");
            }

            const SQL = await initSqlJs({
                locateFile: file => `${file}`
            });

            // 獲取檔案大小
            let size = 0;
            try {
                const headRes = await fetch(localPath, { method: 'HEAD' });
                if (headRes.ok) {
                    const cl = headRes.headers.get('content-length');
                    if (cl) size = parseInt(cl, 10);
                }
            } catch (e) {
                console.warn(`[PCRDatabase] HEAD ${localPath} failed.`, e);
            }

            const cachedSize = localStorage.getItem(sizeKey);
            let forceReload = false;
            if (size > 0 && String(size) !== String(cachedSize)) {
                console.log(`[PCRDatabase] Size mismatch for ${type}. Force reload.`);
                forceReload = true;
                await this.removeFromIDB(dbKey);
            }

            // 嘗試載入快取
            let cachedDB = null;
            if (!forceReload) {
                cachedDB = await this.loadFromIDB(dbKey);
            }

            if (cachedDB) {
                if (onProgress) onProgress(`正在載入本地 ${type.toUpperCase()} 快取...`, 50);
                const specificDb = new SQL.Database(new Uint8Array(cachedDB.format === 2 ? cachedDB.buffer : cachedDB));
                console.log(`[PCRDatabase] Loaded specific DB: ${type} from IndexedDB`);
                return specificDb;
            }

            // 下載檔案
            if (onProgress) onProgress(`正在下載 ${type.toUpperCase()} 資料庫...`, 20);
            const dbData = await this.downloadDB(localPath, (pct) => {
                if (onProgress) onProgress(`正在下載 ${type.toUpperCase()} 資料庫... ${pct}%`, 20 + (pct * 0.7));
            });

            if (dbData) {
                const specificDb = new SQL.Database(new Uint8Array(dbData));
                await this.saveToIDB(dbKey, dbData);
                const finalSize = size > 0 ? size : dbData.byteLength;
                localStorage.setItem(sizeKey, finalSize);
                console.log(`[PCRDatabase] Successfully loaded specific DB: ${type}`);
                return specificDb;
            }

            throw new Error(`無法取得 ${type} 資料庫數據`);
        } catch (error) {
            console.error(`loadSpecificDatabase Error (${type}):`, error);
            if (onProgress) onProgress(`載入 ${type} 失敗: ${error.message}`, 0);
            throw error;
        }
    },



    /**
     * 下載資料庫文件（帶進度回調）
     */
    async downloadDB(dbUrl, onProgress) {
        try {
            console.log(`正在嘗試從 ${dbUrl} 取得資料庫...`);
            const response = await fetch(dbUrl, { cache: 'no-cache', signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const contentLength = response.headers.get('content-length');
            const total = parseInt(contentLength, 10);
            let loaded = 0;

            const reader = response.body.getReader();
            const chunks = [];

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                if (total && onProgress) {
                    onProgress(Math.round((loaded / total) * 100));
                }
            }

            const allChunks = new Uint8Array(loaded);
            let position = 0;
            for (const chunk of chunks) {
                allChunks.set(chunk, position);
                position += chunk.length;
            }
            console.log(`成功從 ${dbUrl} 載入資料庫`);
            return allChunks.buffer;
        } catch (e) {
            console.warn(`從 ${dbUrl} 下載失敗:`, e);
            throw e;
        }
    },

    /**
     * 執行 SQL 查詢並回傳物件陣列
     */
    runQuery(sql, params = []) {
        if (!this.db) throw new Error('資料庫尚未初始化');
        try {
            const stmt = this.db.prepare(sql);
            stmt.bind(params);
            const results = [];
            while (stmt.step()) {
                results.push(stmt.getAsObject());
            }
            stmt.free();
            return results;
        } catch (e) {
            console.error('Query Error:', e, sql);
            return [];
        }
    },

    // --- IndexedDB 存取邏輯 ---

    _openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open('PCRD_DB_STORE', 2);
            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    db.createObjectStore('files');
                }
            };
            request.onsuccess = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('files')) {
                    reject(new Error("Object store 'files' not found in IndexedDB."));
                    return;
                }
                resolve(db);
            };
            request.onerror = (e) => reject(request.error);
        });
    },

    async saveToIDB(key, buffer) {
        try {
            const db = await this._openDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction('files', 'readwrite');
                const store = transaction.objectStore('files');
                store.put(buffer, key);
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error || new Error('快取寫入已中止'));
                transaction.addEventListener('complete', () => db.close());
                transaction.addEventListener('abort', () => db.close());
            });
        } catch (e) {
            console.error("[PCRDatabase] saveToIDB 失敗:", e);
            throw e;
        }
    },

    async loadFromIDB(key) {
        try {
            const db = await this._openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction('files', 'readonly');
                const store = transaction.objectStore('files');
                const getRequest = store.get(key);
                getRequest.onsuccess = () => resolve(getRequest.result);
                getRequest.onerror = () => resolve(null);
            });
        } catch (e) {
            console.warn("[PCRDatabase] loadFromIDB 失敗:", e);
            return null;
        }
    },

    async removeFromIDB(key) {
        try {
            const db = await this._openDB();
            return new Promise((resolve) => {
                const transaction = db.transaction('files', 'readwrite');
                const store = transaction.objectStore('files');
                const deleteRequest = store.delete(key);
                deleteRequest.onsuccess = () => resolve();
                deleteRequest.onerror = () => resolve();
            });
        } catch (e) {
            console.warn("[PCRDatabase] removeFromIDB 失敗:", e);
            return;
        }
    }
};

// === END db.js ===
</script>

    <script>
// === chapter-data.js INLINED ===
console.log("chapter-data.js loaded");
/**
 * PCRD Data Hub - 章節資料服務 (ChapterDataService)
 * 載入並提供章節標題、摘要、順序等中繼資料
 * 以及第 3 部分支劇情補充元數據 (branch_stories.json) 的載入與轉換
 * 資料來源：dashboard/data/chapters.json, branch_stories.json
 */

(function() {
    const ChapterDataService = {
        data: null,
        storySummaries: null,
        branchStories: [],
        loaded: false,

        /**
         * 將 branch_stories.json 資料轉換為 Story Map 的統一 story 物件陣列
         * 嚴格執行 Runtime Schema 與契約驗證 (Fail Loudly)
         * @param {Object} branchData - branch_stories.json 的根物件
         * @returns {Array} 統一 story 結構列表
         */
        transformBranchStories(branchData) {
            if (!branchData) return [];
            if (
                typeof branchData !== 'object' ||
                (branchData.version !== 1 && branchData.version !== 2) ||
                branchData.part !== 3 ||
                !Array.isArray(branchData.stories)
            ) {
                throw new Error("[ChapterDataService] branch_stories.json 結構格式不符合預期 (Schema Error)");
            }

            const seenIds = new Set();
            return branchData.stories.map((s, idx) => {
                // 1. story_id 型別與正整數檢查
                if (!Number.isInteger(s.story_id) || s.story_id <= 0) {
                    throw new Error(`[ChapterDataService] 第 ${idx} 筆分支劇情 story_id 必須為正整數: ${s.story_id}`);
                }
                if (seenIds.has(s.story_id)) {
                    throw new Error(`[ChapterDataService] 發現重複的 story_id: ${s.story_id}`);
                }
                seenIds.add(s.story_id);

                // 2. chapter 範圍與整數檢查 (嚴格限定 1 ~ 16)
                if (!Number.isInteger(s.chapter) || s.chapter < 1 || s.chapter > 16) {
                    throw new Error(`[ChapterDataService] 第 ${idx} 筆分支劇情 chapter 必須為 1~16 之整數: ${s.chapter}`);
                }

                // 3. metadata_status / provenance 契約檢查 (相容 v1 metadata_status 與 v2 field-level provenance)
                const status = s.metadata_status || (s.provenance ? "resolved_official_bundle" : null);
                const isResolved = status === "resolved_official_bundle" || status === "resolved_official_screenshot" || !!s.provenance;
                if (!isResolved && status !== "unresolved") {
                    throw new Error(`[ChapterDataService] 第 ${idx} 筆分支劇情 metadata_status 不合法: ${status}`);
                }

                let chapterDisplay = "";
                let titleDisplay = "";

                // 4. Resolved 契約檢查：必須完整包含非空之 branch_label, title, subtitle
                if (isResolved) {
                    if (
                        typeof s.branch_label !== 'string' || !s.branch_label.trim() ||
                        typeof s.title !== 'string' || !s.title.trim() ||
                        typeof s.subtitle !== 'string' || !s.subtitle.trim()
                    ) {
                        throw new Error(`[ChapterDataService] 第 ${idx} 筆 resolved 分支劇情 (${s.story_id}) 缺少必要之描述性欄位`);
                    }
                    chapterDisplay = s.title;
                    titleDisplay = s.subtitle;
                }

                // 5. Unresolved 契約檢查：branch_label, title, subtitle 必須嚴格為 null
                if (status === "unresolved") {
                    if (s.branch_label !== null || s.title !== null || s.subtitle !== null) {
                        throw new Error(`[ChapterDataService] 第 ${idx} 筆 unresolved 分支劇情 (${s.story_id}) 混入了非 null 描述性欄位`);
                    }
                    const branchIdx = (s.story_id % 100);
                    chapterDisplay = `分支劇情 ${branchIdx}`;
                    titleDisplay = `分支劇情 ${branchIdx}`;
                }

                const groupId = 2200 + s.chapter;

                return {
                    id: s.story_id,
                    chapter: chapterDisplay,
                    title: titleDisplay,
                    groupId: groupId,
                    part: 3,
                    isEvent: false,
                    type: 'main',
                    isBranch: true,
                    branchLabel: s.branch_label || null,
                    metadataStatus: status || (s.provenance ? "resolved_official_bundle" : "unresolved")
                };
            });
        },

        async load() {
            if (this.loaded) return this.data;
            try {
                console.log('[ChapterDataService] 開始載入資料檔...');
                const ver = window.PCRD_DATA_VERSION || (window.PCRDatabase && window.PCRDatabase.dbVersion) || 'dev';
                const [resp, respSum, respBranch] = await Promise.all([
                    fetch('data/chapters.json?v=' + ver),
                    fetch('data/main_story_chapter_summaries.json?v=' + ver).catch(e => {
                        console.error('[ChapterDataService] 載入單話摘要 fetch 失敗:', e);
                        return null;
                    }),
                    fetch('data/branch_stories.json?v=' + ver).catch(e => {
                        console.warn('[ChapterDataService] 載入分支劇情 fetch 失敗 (optional):', e);
                        return null;
                    })
                ]);

                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                this.data = await resp.json();

                if (respSum && respSum.ok) {
                    this.storySummaries = await respSum.json();
                    console.log(`[ChapterDataService] 成功載入單話摘要，共 ${Object.keys(this.storySummaries).length} 筆`);
                } else {
                    console.warn('[ChapterDataService] 單話摘要載入失敗，respSum ok為 false 或未找到檔案。');
                    this.storySummaries = {};
                }

                if (respBranch && respBranch.ok) {
                    const branchJson = await respBranch.json();
                    this.branchStories = this.transformBranchStories(branchJson);
                    console.log(`[ChapterDataService] 成功載入第 3 部分支劇情元數據，共 ${this.branchStories.length} 篇`);
                } else {
                    this.branchStories = [];
                }

                this.loaded = true;
                console.log('[ChapterDataService] 成功載入章節主資料');
            } catch (e) {
                console.error('[ChapterDataService] 載入失敗:', e);
                this.data = { 1: {}, 2: {}, 3: {} };
                this.storySummaries = {};
                this.branchStories = [];
                this.loaded = true;
                throw e; // Fail loudly on malformed data / network failure of core files
            }
            return this.data;
        },

        // 取得章節資訊
        // part: 1|2|3, groupId: story_group_id (如 2001, 2007, 2201, 3001)
        getChapterInfo(part, groupId) {
            if (!this.data) return null;
            const partData = this.data[String(part)] || {};
            const gid = String(groupId);
            // 不分部別，均自 game_world 與 interlude 中尋找對應的群組資料
            return partData.game_world?.[gid] || partData.interlude?.[gid] || partData[gid] || null;
        },

        // 取得章節標題
        getChapterTitle(part, groupId) {
            const info = this.getChapterInfo(part, groupId);
            return info ? info.title : "";
        },

        // 取得章節標題
        getTitle(part, groupId) {
            const info = this.getChapterInfo(part, groupId);
            return info?.title || null;
        },

        // 取得章節摘要
        getSummary(part, groupId) {
            const info = this.getChapterInfo(part, groupId);
            return info?.summary || null;
        },

        // 取得單話資訊
        getStoryInfo(part, groupId, storyId) {
            const info = this.getChapterInfo(part, groupId);
            if (!info || !info.stories) return null;
            return info.stories.find(s => String(s.story_id) === String(storyId)) || null;
        },

        // 取得單話摘要
        getStorySummary(part, groupId, storyId) {
            console.log(`[ChapterDataService] 正在尋找單話摘要, storyId: ${storyId}`);
            if (this.storySummaries && this.storySummaries[String(storyId)]) {
                console.log(`[ChapterDataService] 成功在 main_story_chapter_summaries.json 找到摘要: ${this.storySummaries[String(storyId)].substring(0, 20)}...`);
                return this.storySummaries[String(storyId)];
            }
            const storyInfo = this.getStoryInfo(part, groupId, storyId);
            console.log(`[ChapterDataService] 未能在單話摘要檔中找到，回退使用 chapters.json 大綱: ${storyInfo?.summary ? storyInfo.summary.substring(0, 20) + '...' : '無'}`);
            return storyInfo?.summary || null;
        },

        // 取得章節顯示順序（用於排序）
        getOrder(part, groupId) {
            const info = this.getChapterInfo(part, groupId);
            return info?.order ?? 999;
        },

        // 取得所有章節
        getAllChapters(part) {
            if (!this.data) return [];
            const partData = this.data[String(part)] || {};
            let entries = [];
            
            // 提取 game_world 與 interlude 下的項目
            const gw = Object.entries(partData.game_world || {}).map(([gid, info]) => ({ groupId: parseInt(gid), ...info }));
            const il = Object.entries(partData.interlude || {}).map(([gid, info]) => ({ groupId: parseInt(gid), ...info }));
            
            // 如果外層有直接定義的 flat 資料，也一併提取作為相容性支援
            const flat = Object.entries(partData)
                .filter(([k]) => k !== 'game_world' && k !== 'interlude')
                .map(([gid, info]) => ({ groupId: parseInt(gid), ...info }));

            entries = [...gw, ...il, ...flat];
            return entries.sort((a, b) => a.order - b.order);
        },

        // 由 groupId 推斷部別
        // 2000-2015 → Part 1, 2101-2116 → Part 2, 2201-2230 → Part 3, 3000+ → Part 3
        getPartFromGroupId(groupId) {
            if (groupId >= 2201 && groupId <= 2230) return 3;
            if (groupId >= 2101 && groupId <= 2116) return 2;
            if (groupId >= 3000) return 3;
            if (groupId >= 2000 && groupId <= 2015) return 1;
            return 1;
        },

        // 由 groupId 取得章節鍵名（用於 chapters 物件的 key）
        getChapterKey(part, groupId, fallbackTitle) {
            const info = this.getChapterInfo(part, groupId);
            if (info?.key) return info.key;

            // 回退：依規則生成
            if (part === 1) {
                if (groupId === 2000) return "序章";
                return `第${groupId - 2000}章`;
            }
            if (part === 2) {
                return `第${groupId - 2100}章`;
            }
            if (part === 3) {
                if (groupId >= 2201 && groupId <= 2230) return `第${groupId - 2200}章`;
                if (groupId >= 3001 && groupId <= 3022) return `幕間 ${groupId - 3000}`;
                if (groupId >= 4000) return `幕間 ${groupId - 4000}`;
                return fallbackTitle || `群組 ${groupId}`;
            }
            return fallbackTitle || `群組 ${groupId}`;
        }
    };

    if (typeof window !== 'undefined') {
        window.ChapterDataService = ChapterDataService;
    } else if (typeof global !== 'undefined') {
        global.ChapterDataService = ChapterDataService;
    }
    if (typeof module !== 'undefined' && module.exports) {
        module.exports = ChapterDataService;
    }
})();
// === END chapter-data.js ===
</script>

    <script>
        console.log("Main script block in story_map.html starting...");
        // 檢查是否為本地檔案
        if (window.location.protocol === 'file:') {
            document.getElementById('cors-warning').style.display = 'block';
        }

        // 切換分頁
        async function switchTab(tabId) {
            // 離開 Story Map 頂層分頁時，完整停止 AUTO 與任何手動音訊；
            // 保留已渲染內容與 pending dialogue，回來時不強迫重載閱讀狀態。
            if (tabId !== 'map' && window.QuestMapModule && typeof window.QuestMapModule.teardownPlayback === 'function') {
                window.QuestMapModule.teardownPlayback({ invalidateAsync: false });
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId + '-tab').classList.add('active');
            document.getElementById('tab-' + tabId + '-btn').classList.add('active');

            if (tabId === 'map' && document.getElementById('map-tab').innerHTML.trim() === '') {
                await QuestMapModule.render();
            } else if (tabId === 'characters' && document.getElementById('characters-tab').innerHTML.trim() === '') {
                const container = document.getElementById('characters-tab');
                container.innerHTML = '<div class="loading-mini">角色資料準備中...</div>';
                try {
                    if (window.PCRD_DATABASE_READY) {
                        await window.PCRD_DATABASE_READY;
                    }
                    await CharactersModule.render();
                } catch (err) {
                    container.textContent = '角色資料載入失敗，請重新整理後再試。';
                    console.error(err);
                }
            }
        }

        function hideStartupOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function showStartupNotice(message, id) {
            const main = document.querySelector('main');
            if (!main) return;
            let notice = document.getElementById(id);
            if (!notice) {
                notice = document.createElement('p');
                notice.id = id;
                notice.setAttribute('role', 'status');
                notice.className = 'cache-notice';
                main.prepend(notice);
            }
            notice.textContent = message;
        }

        // 初始化：首頁先顯示；SQLite 與完整 Story Map 資料在背景準備。
        document.addEventListener('DOMContentLoaded', async () => {
            document.addEventListener('keydown', event => QuestMapModule.handleReaderKeydown(event));
            const progress = document.getElementById('loader-progress');
            const text = document.getElementById('loader-text');
            const regionSelector = document.getElementById('region-selector');

            if (regionSelector) {
                regionSelector.value = PCRDatabase.currentRegion;
            }

            // Single shared startup promise. Defer the actual SQLite work to a
            // later browser task so the static landing menu gets the first paint.
            const databaseReadyPromise = new Promise((resolve, reject) => {
                setTimeout(() => {
                    window.PCRDatabase.initDatabase((msg, pct) => {
                        if (text) text.innerText = msg;
                        if (progress) progress.style.width = pct + '%';
                    }).then(resolve, reject);
                }, 0);
            });
            window.PCRD_DATABASE_READY = databaseReadyPromise;

            try {
                // QuestMapModule._render() treats the landing menu as static UI,
                // so this completes without waiting for SQLite or the large data sets.
                await QuestMapModule.render();
                hideStartupOverlay();
            } catch (err) {
                console.error('[Startup] 首頁渲染失敗:', err);
                if (text) text.textContent = '首頁載入失敗，請重新整理後再試。';
                return;
            }

            // Keep preparing the existing data set in the background so current
            // navigation, resume/deep-link behavior and feature availability stay intact.
            window.PCRD_APP_READY = (async () => {
                await databaseReadyPromise;

                if (PCRDatabase.cacheWarning) {
                    showStartupNotice(PCRDatabase.cacheWarning, 'cache-warning-notice');
                }

                await QuestMapModule.loadData();
                window.ReaderNavigation.init(QuestMapModule);
            })();

            window.PCRD_APP_READY.catch(err => {
                console.error('[Startup] 背景資料載入失敗:', err);
                showStartupNotice('背景資料載入失敗；首頁仍可開啟，但劇情與角色資料暫時無法使用。請重新整理後再試。', 'startup-error-notice');
            });
        });
    </script>

name: Export canonical story unit IDs

on:
  push:
    branches:
      - chatgpt/export-story-unit-ids
    paths:
      - .github/workflows/export-story-unit-ids.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Export unique unit IDs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          story_dir = Path('dashboard/story')
          unit_ids = set()
          story_count = 0

          for path in story_dir.glob('*.json'):
              if not path.stem.isdigit():
                  continue
              story_count += 1
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, list):
                  continue
              for row in data:
                  if not isinstance(row, dict):
                      continue
                  uid = row.get('unit_id')
                  if uid is not None:
                      unit_ids.add(int(uid))

          unit_ids = sorted(unit_ids)
          if story_count != 9124:
              raise SystemExit(f'Expected 9124 numeric story files, got {story_count}')
          if len(unit_ids) != 1386:
              raise SystemExit(f'Expected 1386 unique unit_ids, got {len(unit_ids)}')

          out = Path('docs/story_unit_ids_1386.txt')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(map(str, unit_ids)) + '\n', encoding='utf-8')
          print(f'Stories: {story_count}')
          print(f'Unique unit_ids: {len(unit_ids)}')
          print(f'Wrote: {out}')
          PY

      - name: Commit generated inventory
        shell: bash
        run: |
          git config user.name "ChatGPT Cloud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/story_unit_ids_1386.txt
          git diff --cached --quiet && exit 0
          git commit -m "docs: add canonical story unit id inventory"
          git push

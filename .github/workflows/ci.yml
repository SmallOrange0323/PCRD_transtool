name: PCRD Story Map CI

'on':
  pull_request:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  test:
    name: Clean-Clone CI Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Story Parity Gate Tests
        run: python -m unittest tests.test_story_parity_validation -v

      - name: Run Bundle Slimming & Prune Tests
        run: python -m unittest tests.test_bundle_slimming -v

      - name: Run Avatar Manifest & Bundler Tests
        run: python -m unittest tests.test_avatar_manifest_bundler -v

      - name: Run Movie Restore & Identity Preservation Tests
        run: python -m unittest tests.test_movie_restore -v

      - name: Run Avatar Service Tests
        run: node tests/test_avatar_service.js

      - name: Run Dialogue Normalizer Tests
        run: node tests/test_dialogue_normalizer.js

      - name: Run Dialogue View Tests
        run: node tests/test_dialogue_view.js

      - name: Run Media Service Tests
        run: node tests/test_media_service.js

      - name: Run Branch Story Integration Tests
        run: node tests/test_branch_story_integration.js

      - name: Run Chapter Metadata Contract Tests
        run: python -m unittest tests.test_chapter_metadata -v

      - name: Run Chapter Titles Runtime Contract Tests
        run: node tests/test_chapter_titles_runtime.js

      - name: Run Story Asset Service Tests
        run: node tests/test_story_asset_service.js

      - name: Log Local Release Gate Notice
        run: |
          echo "=================================================="
          echo "LEVEL A: Clean-Clone CI Test Suite PASSED"
          echo "=================================================="
          echo "LEVEL B: Local Release Gate is mandatory before production deploy:"
          echo "  1. node tests/test_reality_avatars.js (requires untracked local icons)"
          echo "  2. python -m pipeline.bundle"
          echo "  3. python -m pipeline.validate (requires full local stories)"
          echo "  4. python update_story_map.py --dry-run"
          echo "=================================================="

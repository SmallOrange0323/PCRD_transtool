name: Fast avatar coverage audit

on:
  push:
    branches:
      - chatgpt/export-story-unit-ids
    paths:
      - .github/workflows/avatar-coverage-audit-fast.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            docs/story_unit_ids_1386.txt
            dashboard/data/avatar_assets.json
            dashboard/icon/unit
          sparse-checkout-cone-mode: false

      - name: Fetch deployed gh-pages tree
        shell: bash
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1 --filter=blob:none

      - name: Audit story avatar coverage
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          story_ids = [int(x) for x in Path('docs/story_unit_ids_1386.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          av = json.loads(Path('dashboard/data/avatar_assets.json').read_text(encoding='utf-8'))
          dialogue_entries = {int(a['unit_id']): a for a in av.get('assets', []) if a.get('usage') == 'dialogue' and a.get('unit_id') is not None}
          main_files = {p.name for p in Path('dashboard/icon/unit').glob('*') if p.is_file()}
          gh_out = subprocess.check_output(['git','ls-tree','-r','--name-only','origin/gh-pages','--','icon/unit'], text=True)
          gh_files = {Path(x).name for x in gh_out.splitlines() if x.strip()}

          cats = {k: [] for k in ['active_ok','placeholder','registry_only','recover_gh','needs_unpack','active_recover_gh','active_missing_all']}
          for uid in story_ids:
              entry = dialogue_entries.get(uid)
              expected = f'{uid:06d}.png'
              if entry:
                  status = entry.get('status')
                  filename = entry.get('filename') or expected
                  if status == 'placeholder_only': cats['placeholder'].append(uid)
                  elif status == 'active':
                      if filename in main_files: cats['active_ok'].append(uid)
                      elif filename in gh_files: cats['active_recover_gh'].append(uid)
                      else: cats['active_missing_all'].append(uid)
                  else:
                      if filename in main_files: cats['registry_only'].append(uid)
                      elif filename in gh_files: cats['recover_gh'].append(uid)
                      else: cats['needs_unpack'].append(uid)
              else:
                  if expected in main_files: cats['registry_only'].append(uid)
                  elif expected in gh_files: cats['recover_gh'].append(uid)
                  else: cats['needs_unpack'].append(uid)

          assert len(story_ids) == 1386
          assert sum(map(len, cats.values())) == 1386

          names = {
            'registry_only':'avatar_registry_only_ids.txt',
            'recover_gh':'avatar_recover_from_gh_pages_ids.txt',
            'needs_unpack':'avatar_needs_unpack_ids.txt',
            'active_recover_gh':'avatar_active_registry_main_png_missing_gh_present_ids.txt',
            'active_missing_all':'avatar_active_registry_png_missing_everywhere_ids.txt',
          }
          Path('docs').mkdir(exist_ok=True)
          for key, fn in names.items():
              Path('docs', fn).write_text(''.join(f'{x}\n' for x in sorted(cats[key])), encoding='utf-8')

          unresolved = sum(len(cats[k]) for k in names)
          report = f'''# Avatar Coverage Audit\n\n- Story unique unit IDs: {len(story_ids)}\n- Dialogue registry entries: {len(dialogue_entries)}\n- Active + PNG present in main: {len(cats['active_ok'])}\n- Placeholder-only: {len(cats['placeholder'])}\n- Missing registry but PNG already in main (registry-only fix): {len(cats['registry_only'])}\n- Missing registry/main PNG but PNG exists on gh-pages (recover; no unpack): {len(cats['recover_gh'])}\n- Missing registry and PNG absent from both main + gh-pages (needs official unpack): {len(cats['needs_unpack'])}\n- Active registry but PNG missing in main, present on gh-pages (recover; no unpack): {len(cats['active_recover_gh'])}\n- Active registry but PNG missing from both main + gh-pages (needs investigation/unpack): {len(cats['active_missing_all'])}\n- Total unresolved against main: {unresolved}\n- Partition total: {sum(map(len,cats.values()))}\n'''
          Path('docs/avatar_coverage_audit.md').write_text(report, encoding='utf-8')
          print(report)
          for key in names:
              print(key, len(cats[key]), sorted(cats[key])[:30])
          PY

      - name: Commit audit outputs
        shell: bash
        run: |
          git config user.name "ChatGPT Cloud"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/avatar_coverage_audit.md docs/avatar_*_ids.txt
          git diff --cached --quiet && exit 0
          git commit -m "docs: add avatar coverage audit"
          git push

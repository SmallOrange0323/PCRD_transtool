<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCR 劇情與角色導航站</title>
    <meta name="description" content="公主連結 Re:Dive 劇情編年史 — 完整主線、角色、公會、活動劇情對話文本與角色圖鑑導航">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- 樣式表 -->
    <link rel="stylesheet" href="style.css?v=20260916">

    <!-- 函式庫與全域版本 -->
    <script src="sql-wasm.js"></script>
    <script>window.PCRD_DATA_VERSION = window.PCRD_DATA_VERSION || "20260913_init";</script>
</head>
<body>
    <!-- 載入覆蓋層 -->
    <div id="loading-overlay">
        <div class="loader-container">
            <h2 style="margin-bottom: 20px; text-align: center;">PCRD Story Map</h2>
            <div class="loader-bar">
                <div id="loader-progress" class="loader-progress"></div>
            </div>
            <div id="loader-text" class="loader-text">正在初始化引擎...</div>
        </div>
        <div id="cors-warning" style="display: none; margin-top: 30px; max-width: 400px; color: #ff6b6b; text-align: center; font-size: 0.85rem;">
            ⚠️ 檢測到使用 file:// 開啟。由於瀏覽器 CORS 限制，資料庫下載可能會失敗。請使用 Live Server 或本地 HTTP 伺服器開啟。
        </div>
    </div>

    <!-- 導航列 -->
    <nav class="navbar">
        <div class="nav-logo">
            <span class="icon">🗺️</span> PCRD 劇情與角色導航站
        </div>
        <div class="nav-tabs">
            <button id="tab-map-btn" class="tab-btn active" onclick="switchTab('map')">劇情地圖</button>
            <button id="tab-characters-btn" class="tab-btn" onclick="switchTab('characters')">角色圖鑑</button>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- 主內容區 -->
    <main class="container">
        <!-- 分頁 1: 劇情地圖 -->
        <div id="map-tab" class="tab-content active"></div>

        <!-- 分頁 2: 角色 -->
        <div id="characters-tab" class="tab-content"></div>
    </main>

    <!-- 角色詳情彈窗 -->
    <div id="char-detail-modal" class="modal-overlay" onclick="if(event.target === this) CharactersModule.closeDetail()">
        <div class="modal-content glass-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="CharactersModule.closeDetail()">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- 程式腳本 -->
    <script src="db.js?v=20260916"></script>
    <script src="avatar-service.js?v=5.2.2"></script>
    <script src="story-asset-service.js?v=5.2.1"></script>
    <script src="chapter-data.js?v=5.2.2"></script>
    <script src="characters.js?v=20260916"></script>
    <script src="speaker-view.js?v=5.4.0"></script>
    <script src="chara-modal.js?v=5.4.0"></script>
    <script src="dialogue-normalizer.js?v=5.4.0"></script>
    <script src="media-service.js?v=5.4.0"></script>
    <script src="dialogue-view.js?v=5.5.0"></script>
    <script src="auto-voice-controller.js?v=1.0.0"></script>
    <script src="story-data-service.js?v=1.0.0"></script>
    <script src="map.js?v=20260916"></script>
    <script src="reader-navigation.js?v=1.0.0"></script>

    <script>
        console.log("Main script block in story_map.html starting...");
        // 檢查是否為本地檔案
        if (window.location.protocol === 'file:') {
            document.getElementById('cors-warning').style.display = 'block';
        }

        // 切換分頁
        async function switchTab(tabId) {
            // 離開 Story Map 頂層分頁時，完整停止 AUTO 與任何手動音訊；
            // 保留已渲染內容與 pending dialogue，回來時不強迫重載閱讀狀態。
            if (tabId !== 'map' && window.QuestMapModule && typeof window.QuestMapModule.teardownPlayback === 'function') {
                window.QuestMapModule.teardownPlayback({ invalidateAsync: false });
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId + '-tab').classList.add('active');
            document.getElementById('tab-' + tabId + '-btn').classList.add('active');

            if (tabId === 'map' && document.getElementById('map-tab').innerHTML.trim() === '') {
                await QuestMapModule.render();
            } else if (tabId === 'characters' && document.getElementById('characters-tab').innerHTML.trim() === '') {
                const container = document.getElementById('characters-tab');
                container.innerHTML = '<div class="loading-mini">角色資料準備中...</div>';
                try {
                    if (window.PCRD_DATABASE_READY) {
                        await window.PCRD_DATABASE_READY;
                    }
                    await CharactersModule.render();
                } catch (err) {
                    container.textContent = '角色資料載入失敗，請重新整理後再試。';
                    console.error(err);
                }
            }
        }

        function hideStartupOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (!overlay) return;
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function showStartupNotice(message, id) {
            const main = document.querySelector('main');
            if (!main) return;
            let notice = document.getElementById(id);
            if (!notice) {
                notice = document.createElement('p');
                notice.id = id;
                notice.setAttribute('role', 'status');
                notice.className = 'cache-notice';
                main.prepend(notice);
            }
            notice.textContent = message;
        }

        // 初始化：首頁先顯示；SQLite 與完整 Story Map 資料在背景準備。
        document.addEventListener('DOMContentLoaded', async () => {
            document.addEventListener('keydown', event => QuestMapModule.handleReaderKeydown(event));
            const progress = document.getElementById('loader-progress');
            const text = document.getElementById('loader-text');
            const regionSelector = document.getElementById('region-selector');

            if (regionSelector) {
                regionSelector.value = PCRDatabase.currentRegion;
            }

            // Single shared startup promise. Defer the actual SQLite work to a
            // later browser task so the static landing menu gets the first paint.
            const databaseReadyPromise = new Promise((resolve, reject) => {
                setTimeout(() => {
                    window.PCRDatabase.initDatabase((msg, pct) => {
                        if (text) text.innerText = msg;
                        if (progress) progress.style.width = pct + '%';
                    }).then(resolve, reject);
                }, 0);
            });
            window.PCRD_DATABASE_READY = databaseReadyPromise;

            try {
                // QuestMapModule._render() treats the landing menu as static UI,
                // so this completes without waiting for SQLite or the large data sets.
                await QuestMapModule.render();
                hideStartupOverlay();
            } catch (err) {
                console.error('[Startup] 首頁渲染失敗:', err);
                if (text) text.textContent = '首頁載入失敗，請重新整理後再試。';
                return;
            }

            // Keep preparing the existing data set in the background so current
            // navigation, resume/deep-link behavior and feature availability stay intact.
            window.PCRD_APP_READY = (async () => {
                await databaseReadyPromise;

                if (PCRDatabase.cacheWarning) {
                    showStartupNotice(PCRDatabase.cacheWarning, 'cache-warning-notice');
                }

                await QuestMapModule.loadData();
                window.ReaderNavigation.init(QuestMapModule);
            })();

            window.PCRD_APP_READY.catch(err => {
                console.error('[Startup] 背景資料載入失敗:', err);
                showStartupNotice('背景資料載入失敗；首頁仍可開啟，但劇情與角色資料暫時無法使用。請重新整理後再試。', 'startup-error-notice');
            });
        });
    </script>
</body>
</html>

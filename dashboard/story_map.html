<body>
    <!-- 載入覆蓋層 -->
    <div id="loading-overlay">
        <div class="loader-container">
            <h2 style="margin-bottom: 20px; text-align: center;">PCRD Story Map</h2>
            <div class="loader-bar">
                <div id="loader-progress" class="loader-progress"></div>
            </div>
            <div id="loader-text" class="loader-text">正在初始化引擎...</div>
        </div>
        <div id="cors-warning" style="display: none; margin-top: 30px; max-width: 400px; color: #ff6b6b; text-align: center; font-size: 0.85rem;">
            ⚠️ 檢測到使用 file:// 開啟。由於瀏覽器 CORS 限制，資料庫下載可能會失敗。請使用 Live Server 或本地 HTTP 伺服器開啟。
        </div>
    </div>

    <!-- 導航列 -->
    <nav class="navbar">
        <div class="nav-logo">
            <span class="icon">🗺️</span> PCRD 劇情與角色導航站
        </div>
        <div class="nav-tabs">
            <button id="tab-map-btn" class="tab-btn active" onclick="switchTab('map')">劇情地圖</button>
            <button id="tab-characters-btn" class="tab-btn" onclick="switchTab('characters')">角色圖鑑</button>
        </div>
        <div class="nav-right"></div>
    </nav>

    <!-- 主內容區 -->
    <main class="container">
        <!-- 分頁 1: 劇情地圖 -->
        <div id="map-tab" class="tab-content active"></div>

        <!-- 分頁 2: 角色 -->
        <div id="characters-tab" class="tab-content"></div>
    </main>

    <!-- 角色詳情彈窗 -->
    <div id="char-detail-modal" class="modal-overlay" onclick="if(event.target === this) CharactersModule.closeDetail()">
        <div class="modal-content glass-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="CharactersModule.closeDetail()">×</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- 程式腳本 -->
    <script src="db.js?v=20260916"></script>
    <script src="avatar-service.js?v=5.2.2"></script>
    <script src="story-asset-service.js?v=5.2.1"></script>
    <script src="chapter-data.js?v=5.2.2"></script>
    <script src="characters.js?v=5.2.0"></script>
    <script src="speaker-view.js?v=5.4.0"></script>
    <script src="chara-modal.js?v=5.4.0"></script>
    <script src="dialogue-normalizer.js?v=5.4.0"></script>
    <script src="media-service.js?v=5.4.0"></script>
    <script src="dialogue-view.js?v=5.5.0"></script>
    <script src="auto-voice-controller.js?v=1.0.0"></script>
    <script src="story-data-service.js?v=1.0.0"></script>
    <script src="map.js?v=5.4.0"></script>

    <!-- Stabilization A: Story Map playback / async lifecycle hardening -->
    <script>
    (function() {
        if (!window.QuestMapModule) return;
        const QuestMapModule = window.QuestMapModule;

        QuestMapModule._stopStoryPlayback = function() {
            if (window.AutoVoiceController && typeof window.AutoVoiceController.stop === 'function') {
                window.AutoVoiceController.stop();
            }
            // AUTO.stop() normally delegates here too; this explicit stop also
            // covers manual voice playback while AUTO itself is IDLE.
            if (window.MediaService && typeof window.MediaService.stopVoice === 'function') {
                window.MediaService.stopVoice();
            }
        };

        QuestMapModule._invalidateStoryAsyncWork = function() {
            this._storyRenderToken = (this._storyRenderToken || 0) + 1;
            this._dialogueLoadingToken = null;
            this.isLoadingDialogue = false;
        };

        QuestMapModule.teardownPlayback = function(options = {}) {
            this._stopStoryPlayback();
            if (options.invalidateAsync === true) {
                this._invalidateStoryAsyncWork();
            }
        };

        // 1) Same-story re-selection must be a strict no-op. Legacy selectStory()
        // stops AUTO before its identity check, so guard before delegation.
        const originalSelectStory = QuestMapModule.selectStory;
        QuestMapModule.selectStory = async function(storyId) {
            if (this.activeStoryId === storyId) {
                return;
            }
            this._stopStoryPlayback();
            return originalSelectStory.call(this, storyId);
        };

        // 2) Dialogue async commits use token + story guards and re-resolve live
        // DOM targets after the final await, never a stale captured board.
        QuestMapModule.loadDialogue = async function(storyId, token) {
            const currentToken = token || this._storyRenderToken;
            const isCurrentStory = () => (
                currentToken === this._storyRenderToken &&
                this.activeStoryId === storyId
            );

            if (!isCurrentStory()) return;

            const initialBoard = document.getElementById('dialogue-board');
            if (!initialBoard) return;
            if (this._dialogueLoadingToken === currentToken) return;

            this._dialogueLoadingToken = currentToken;
            this.isLoadingDialogue = true;
            window.DialogueView.renderLoading(initialBoard);

            try {
                let dialogueList;
                let speakerNames;
                const cached = this._dialogueCache.get(storyId);

                if (cached) {
                    dialogueList = cached.dialogueList;
                    speakerNames = cached.speakerNames;
                } else {
                    const ver = window.PCRD_DATA_VERSION || (window.PCRDatabase && window.PCRDatabase.dbVersion) || 'dev';
                    const response = await fetch(`story/${storyId}.json?v=${ver}`);
                    if (!response.ok) throw new Error("HTTP " + response.status);

                    const rawDialogueList = await response.json();
                    if (!isCurrentStory()) return;

                    if (!rawDialogueList || rawDialogueList.length === 0) {
                        const liveBoard = document.getElementById('dialogue-board');
                        if (liveBoard && isCurrentStory()) {
                            window.DialogueView.renderEmpty(liveBoard);
                        }
                        return;
                    }

                    const normalized = window.DialogueNormalizer.normalize(rawDialogueList);
                    dialogueList = normalized.dialogueList;
                    speakerNames = normalized.speakerNames;

                    if (this._dialogueCache.size >= 30) {
                        const oldestKey = this._dialogueCache.keys().next().value;
                        this._dialogueCache.delete(oldestKey);
                    }
                    this._dialogueCache.set(storyId, { dialogueList, speakerNames });
                }

                await this.loadDialogueAvatars(speakerNames);
                if (!isCurrentStory()) return;

                // Final commit barrier: resolve the board after the last await.
                const liveBoard = document.getElementById('dialogue-board');
                if (!liveBoard || !isCurrentStory()) return;

                const badgesBar = document.getElementById('chara-badges-bar');
                const cinemaPanel = document.querySelector('.cinema-panel');
                const currentStoryObj = this.getStoryById(storyId);

                window.DialogueView.renderDialogue({
                    boardEl: liveBoard,
                    badgesBarEl: badgesBar,
                    cinemaPanelEl: cinemaPanel,
                    storyId,
                    dialogueList,
                    speakerNames,
                    speakerAvatars: this.speakerAvatars,
                    currentStoryObj,
                    resolveRealName: this.getCharaRealName.bind(this),
                    escapeHtml: this.escapeHtml.bind(this)
                });

                if (!isCurrentStory()) return;
                this.currentDialogueList = dialogueList;
                this.updateAutoVoiceUI();

                if (this.autoVoiceStartIndex !== null && window.DialogueView && typeof window.DialogueView.setAutoStartSelection === 'function') {
                    window.DialogueView.setAutoStartSelection(liveBoard, this.autoVoiceStartIndex);
                }
            } catch (err) {
                if (isCurrentStory()) {
                    console.error("加載台詞失敗:", err);
                    const liveBoard = document.getElementById('dialogue-board');
                    if (liveBoard && isCurrentStory()) {
                        window.DialogueView.renderError(liveBoard, storyId);
                    }
                }
            } finally {
                if (this._dialogueLoadingToken === currentToken) {
                    this._dialogueLoadingToken = null;
                    this.isLoadingDialogue = false;
                }
            }
        };

        // 3) Any reader/view exit must stop AUTO and manual audio. When the
        // story is abandoned, pending dialogue work is invalidated too.
        const originalExitReader = QuestMapModule.exitReader;
        QuestMapModule.exitReader = function() {
            this.teardownPlayback({ invalidateAsync: true });
            return originalExitReader.apply(this, arguments);
        };

        const originalGoBackToMenu = QuestMapModule.goBackToMenu;
        QuestMapModule.goBackToMenu = function() {
            this.teardownPlayback({ invalidateAsync: true });
            return originalGoBackToMenu.apply(this, arguments);
        };

        ['switchTabType', 'enterCategory', 'switchPart'].forEach(methodName => {
            const original = QuestMapModule[methodName];
            if (typeof original !== 'function') return;
            QuestMapModule[methodName] = function() {
                this.teardownPlayback({ invalidateAsync: true });
                return original.apply(this, arguments);
            };
        });

        window.addEventListener('pagehide', () => {
            QuestMapModule.teardownPlayback({ invalidateAsync: true });
        });
    })();
    </script>

    <script>
        console.log("Main script block in story_map.html starting...");
        // 檢查是否為本地檔案
        if (window.location.protocol === 'file:') {
            document.getElementById('cors-warning').style.display = 'block';
        }

        // 切換分頁
        function switchTab(tabId) {
            // 離開 Story Map 頂層分頁時，完整停止 AUTO 與任何手動音訊；
            // 保留已渲染內容與 pending dialogue，回來時不強迫重載閱讀狀態。
            if (tabId !== 'map' && window.QuestMapModule && typeof window.QuestMapModule.teardownPlayback === 'function') {
                window.QuestMapModule.teardownPlayback({ invalidateAsync: false });
            }

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId + '-tab').classList.add('active');
            document.getElementById('tab-' + tabId + '-btn').classList.add('active');

            // 如果分頁內容是空的，進行渲染
            if (tabId === 'map' && document.getElementById('map-tab').innerHTML.trim() === '') {
                QuestMapModule.render();
            } else if (tabId === 'characters' && document.getElementById('characters-tab').innerHTML.trim() === '') {
                CharactersModule.render();
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            document.addEventListener('keydown', event => QuestMapModule.handleReaderKeydown(event));
            const progress = document.getElementById('loader-progress');
            const text = document.getElementById('loader-text');
            const regionSelector = document.getElementById('region-selector');

            // 同步選擇器狀態
            if (regionSelector) {
                regionSelector.value = PCRDatabase.currentRegion;
            }

            try {
                // 載入資料庫
                await window.PCRDatabase.initDatabase((msg, pct) => {
                    text.innerText = msg;
                    progress.style.width = pct + '%';
                });

                if (PCRDatabase.cacheWarning) {
                    const notice = document.createElement('p');
                    notice.setAttribute('role', 'status');
                    notice.className = 'cache-notice';
                    notice.textContent = PCRDatabase.cacheWarning;
                    document.querySelector('main').prepend(notice);
                }

                // 移除載入遮罩
                const overlay = document.getElementById('loading-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);

                // 預設渲染劇情地圖
                QuestMapModule.render();
            } catch (err) {
                text.innerHTML = `
                    <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px;">
                        <span style="color: #ff6b6b; font-weight: bold; font-size: 1.05rem;">資料庫載入失敗！可能是網路連線問題。</span>
                        <span style="color: #ffb8b8; font-size: 0.85rem; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 4px; font-family: monospace; max-width: 90%; word-break: break-all;">錯誤原因：${err.message || err}</span>
                        <button onclick="localStorage.setItem('pcr_region', 'tw'); location.reload();" style="
                            padding: 10px 24px;
                            background: linear-gradient(135deg, #ff6b9d 0%, #e83875 100%);
                            color: white;
                            border: none;
                            border-radius: 20px;
                            font-weight: bold;
                            cursor: pointer;
                            box-shadow: 0 4px 12px rgba(232, 56, 117, 0.25);
                            transition: all 0.2s ease;
                            font-size: 0.9rem;
                        " onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
                            🔄 切換回台服 (TW) 重新載入
                        </button>
                    </div>
                `;
                console.error(err);
            }
        });
    </script>
</body>
</html>
